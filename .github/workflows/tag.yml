name: Tag

on:
  push:
    branches:
      - main
    # A merge that does not touch VERSION releases nothing, so the job never
    # starts for one. Editing only the comments in VERSION does start it, and so
    # does a revert that restores an already-tagged version. The guard below
    # ends both without tagging anything.
    paths:
      - VERSION

permissions: {}

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag is created through the API rather than pushed, so the checkout
      # keeps no credentials. A tag made with GITHUB_TOKEN starts no further
      # workflow runs, which is why nothing here listens for one.
      - name: Tag the version in VERSION
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          tag="v$(.github/scripts/read-version.sh)"
          probe=0
          .github/scripts/tag-exists.sh "${REPOSITORY}" "${tag}" || probe=$?
          case "${probe}" in
            0)
              echo "${tag} already exists. This push released nothing."
              exit 0
              ;;
            1) ;;
            *)
              # tag-exists.sh has already said what went wrong. Stop rather than
              # push a tag that may collide.
              exit 1
              ;;
          esac

          gh api "repos/${REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${tag}" \
            -f "sha=${COMMIT}" >/dev/null
          echo "Tagged ${COMMIT} as ${tag}."
