name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  lint-tf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set tool versions
        uses: wistia/parse-tool-versions@32f568a4ffd4bfa7720ebf93f171597d1ebc979a # v2.1.1
        with:
          postfix: _TOOL_VERSION

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_TOOL_VERSION }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: ${{ env.TFLINT_TOOL_VERSION }}

      - name: Run pre-commit checks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

  validate-min-providers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set tool versions
        uses: wistia/parse-tool-versions@32f568a4ffd4bfa7720ebf93f171597d1ebc979a # v2.1.1
        with:
          postfix: _TOOL_VERSION

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_TOOL_VERSION }}

      # Without this the run resolves the newest matching release and the
      # advertised floor is never exercised. The override file is generated
      # here and never committed, so it does not pin consumers.
      - name: Pin providers to their declared minimums
        run: python3 .github/scripts/pin-min-providers.py > zz-min-providers_override.tf

      - name: Validate against the declared minimums
        run: |
          terraform init -backend=false
          terraform validate

  check-version:
    runs-on: ubuntu-latest
    # On a push to main the tag job reads VERSION. This check runs earlier, so
    # a version the tag job rejects fails the pull request instead of the merge.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Both revisions are read through the head revision of the script, and
      # the comparison is on the parsed versions rather than on the file. A
      # pull request that only edits the comments in VERSION releases nothing
      # and must not fail here.
      - name: Check the version this pull request releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          version="$(.github/scripts/read-version.sh)"

          base_version=""
          if git cat-file -e "${BASE}:VERSION" 2>/dev/null; then
            git show "${BASE}:VERSION" > "${RUNNER_TEMP}/base-VERSION"
            base_version="$(.github/scripts/read-version.sh "${RUNNER_TEMP}/base-VERSION" 2>/dev/null || true)"
          fi

          if [ "${version}" = "${base_version}" ]; then
            echo "VERSION still reads ${version}, so merging this releases nothing."
            exit 0
          fi

          # Releases only go up. Comparing against the base rather than against
          # the highest tag keeps this to one rule: VERSION on main is what gets
          # tagged, so main's copy is the floor for anything branched off it.
          if [ -n "${base_version}" ] \
            && [ "$(printf '%s\n%s\n' "${version}" "${base_version}" | sort -V | head -n 1)" = "${version}" ]; then
            echo "VERSION moves down from ${base_version} to ${version}. A release has to raise it." >&2
            exit 1
          fi

          tag="v${version}"
          probe=0
          .github/scripts/tag-exists.sh "${REPOSITORY}" "${tag}" || probe=$?
          case "${probe}" in
            0)
              echo "${tag} is already tagged. Raise VERSION above it." >&2
              exit 1
              ;;
            1)
              echo "Merging this pull request tags ${tag}."
              ;;
            *)
              # tag-exists.sh has already said what went wrong. Fail rather than
              # assume the tag is free.
              exit 1
              ;;
          esac
